publish_to: 'none'

version: 1.0.7+8

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
